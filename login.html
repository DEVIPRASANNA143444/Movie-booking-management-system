<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookIt</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BookIt.</a>
        <ul class="nav-links">
            <li><a href="register.html">Sign Up</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="l-email" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="l-password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #aaa;">
                New here? <a href="register.html" style="color: var(--primary-color);">Create an account</a>
            </p>
            <p style="text-align: center; margin-top: 10px; font-size: 12px; color: #555;">Admin Login: admin@bookit.com / Admin@123</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BookIt App.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
