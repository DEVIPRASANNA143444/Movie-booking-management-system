<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BookIt</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BookIt.</a>
        <ul class="nav-links">
            <li><a href="login.html">Sign In</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="r-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="r-email" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="r-password" required placeholder="Create password" minlength="6">
                    <div class="password-strength"><div class="strength-bar" id="strength-bar"></div></div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #aaa;">
                Already have an account? <a href="login.html" style="color: var(--primary-color);">Login</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BookIt App.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
